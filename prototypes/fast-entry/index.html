  date: todayISO(), note: '', idemKey: uid(), cStep: 1, repeatOf: null, error: null, ...over,
});
const vendorLabel = kind => kind === 'income' ? 'Source' : 'Vendor';
function recentCurrencies(db) {
  const seen = [];
  live(db).slice().sort((a, b) => b.createdAt - a.createdAt).forEach(e => { if (e.currency !== PRIMARY && !seen.includes(e.currency)) seen.push(e.currency); });
  return seen;
}
function recentForRepeat(db, kind, n) {
  const out = [], seen = new Set();
  live(db).filter(e => e.kind === kind).sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt).forEach(e => {
    const k = e.vendorId + '|' + e.amountMinor + '|' + e.categoryId;
    if (!seen.has(k) && out.length < n) { seen.add(k); out.push(e); }
  });
  return out;
}

function vendorHint(db, v, kind, u) {

// ---------- panel ----------
const VARIANTS = [
  { key: 'keypad', label: 'A', name: 'Keypad', Comp: VariantKeypad,
    about: 'Amount first on a built-in number pad, so the system keyboard never covers the screen. Other fields are tiles that open sheets. Repeat lives on the entry list: tap ↻ Repeat on a row, or Cancel here to see the list.' },
  { key: 'form', label: 'B', name: 'Classic form', Comp: VariantForm,
    about: 'One scrolling form with the system keyboard. Every field is visible at once; categories are tap targets, the vendor box suggests inline. Repeat lives on the entry list.' },
  { key: 'vendor-first', label: 'C', name: 'Vendor first', Comp: VariantVendorFirst,
    about: 'Two steps: pick where, then type the amount. The vendor prefill writes the sentence for you; recent entries repeat in one tap from step one.' },
];
function Elapsed({ since, running }) {
  const [, tick] = useState(0);
  useEffect(() => { if (!running) return; const t = setInterval(() => tick(x => x + 1), 100); return () => clearInterval(t); }, [running]);
  const s = (Date.now() - since) / 1000;
  return html`<div class=${'timer ' + (!running ? '' : s <= 10 ? 'ok' : 'slow')}>${running ? s.toFixed(1) + ' s' : '—'}</div>`;
}
function Panel({ variant, draft, db, openedAt, screen, times, log }) {
  const v = VARIANTS.find(x => x.key === variant);
  const shown = { ...draft, amountMinor: (draft.refund ? -1 : 1) * parseMinor(draft.amount), category: catName(draft.categoryId) };
  delete shown.error;
  const med = times.length ? times.slice().sort((a, b) => a - b)[Math.floor(times.length / 2)] : null;
  return html`<aside class="panel">
    <div class="card"><h2>${v.label} · ${v.name}</h2><p>${v.about}</p></div>
    <div class="card"><span class="eyebrow">This entry, open to save (goal ≤ 10 s)</span>
      <${Elapsed} since=${openedAt} running=${screen === 'form'} />
      <span class="mono">${times.length ? `saves: ${times.map(t => t.toFixed(1)).join(', ')} s · median ${med.toFixed(1)} s` : 'no saves yet'}</span></div>
    <div class="card"><span class="eyebrow">Try this</span><ul class="try">
      <li>Vendor <b>pekra zora</b>: "Did you mean" Pekara Zora</li>
      <li>Vendor <b>kafana sljivik</b>: matches Kafana Šljivik silently</li>
      <li>Vendor <b>stara knjizara</b>: archived vendor comes back</li>
      <li>Pick <b>Hotel Adria</b>: currency switches to EUR</li>
      <li>Pick <b>Kafe Ugao</b>: Eating out, its latest category, not the older Fun</li>
      <li>Type <b>-1990</b> in a typed amount box (B, C): Refund turns on</li>
      <li>Switch to Income: the field becomes Source</li>
    </ul></div>
    <div class="card"><span class="eyebrow">Draft</span><pre class="json">${JSON.stringify(shown, null, 2)}</pre></div>
    <div class="card"><span class="eyebrow">Events</span><ul class="log">${log.length ? log.map(l => html`<li>${l}</li>`) : html`<li>nothing yet</li>`}</ul></div>
  </aside>`;
}

// ---------- app ----------
const hashVariant = () => { const k = location.hash.slice(1); return VARIANTS.some(v => v.key === k) ? k : 'keypad'; };
function App() {
  const [variant, setVariant] = useState(hashVariant);
  const [db, setDb] = useState(seed);
  const [screen, setScreen] = useState('form');
  const [draft, setDraft] = useState(() => blankDraft());
  const [openedAt, setOpenedAt] = useState(Date.now());
  const [times, setTimes] = useState([]);
  const [toast, setToast] = useState(null);
  const [log, setLog] = useState([]);
  const addLog = msg => setLog(l => [msg, ...l].slice(0, 10));

  useEffect(() => {
    const onHash = () => setVariant(hashVariant());
    const onKey = e => {
      const a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const i = VARIANTS.findIndex(v => v.key === hashVariant());
      location.hash = VARIANTS[(i + (e.key === 'ArrowRight' ? 1 : VARIANTS.length - 1)) % VARIANTS.length].key;
    };
    window.addEventListener('hashchange', onHash); window.addEventListener('keydown', onKey);
    return () => { window.removeEventListener('hashchange', onHash); window.removeEventListener('keydown', onKey); };
  }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 8000); return () => clearTimeout(t); }, [toast]);

  const startForm = d => { setDraft(d); setOpenedAt(Date.now()); setScreen('form'); };
  const m = {
    set: p => setDraft(d => ({ ...d, ...p, error: null })),
    setKind: k => setDraft(d => { const b = { ...d, kind: k, categoryId: null, categoryTouched: false, refund: false, error: null }; return { ...b, ...prefillPatch(db, b, d.vendorId, k) }; }),
    typeVendor: text => setDraft(d => {
      const k = norm(text);
      const ex = k ? db.vendors.find(v => !v.archived && norm(v.name) === k) : null;
      const b = { ...d, vendorText: text, vendorId: ex ? ex.id : null, vendorNew: false, error: null };
      if (!ex) return { ...b, prefill: null };
      return ex.id === d.vendorId ? b : { ...b, ...prefillPatch(db, b, ex.id, d.kind) };
    }),
    pickVendor: v => {
      if (v.archived) { setDb(x => ({ ...x, vendors: x.vendors.map(y => y.id === v.id ? { ...y, archived: false } : y) })); addLog(`Unarchived ${v.name}`); }
      const e = latestFor(db, v.id, draft.kind);
      addLog(`Picked ${v.name}` + (e ? ` → prefill ${catName(e.categoryId)}, ${e.currency}` : ' (no history, no prefill)'));
      setDraft(d => { const b = { ...d, vendorText: v.name, vendorId: v.id, vendorNew: false, error: null }; return { ...b, ...prefillPatch(db, b, v.id, d.kind) }; });
    },
    createVendor: name => { addLog(`Will create «${name}» on save`); setDraft(d => ({ ...d, vendorText: name, vendorId: null, vendorNew: true, prefill: null, error: null })); },
    clearVendor: () => setDraft(d => ({ ...d, vendorText: '', vendorId: null, vendorNew: false, prefill: null })),
    setCategory: id => setDraft(d => ({ ...d, categoryId: id, categoryTouched: true, error: null })),
    setCurrency: c => setDraft(d => ({ ...d, currency: c, currencyTouched: true })),
    setAmount: raw => setDraft(d => {
      const neg = /^\s*[-−]/.test(raw);
      return { ...d, amount: sanitize(raw), refund: neg && d.kind === 'expense' ? true : d.refund, error: null };
    }),
    key: k => setDraft(d => ({ ...d, amount: k === '⌫' ? d.amount.slice(0, -1) : sanitize(d.amount + k), error: null })),
    toggleRefund: () => setDraft(d => d.kind === 'expense' ? { ...d, refund: !d.refund } : d),
    cancel: () => { setScreen('list'); addLog('Cancelled'); },
    openNew: () => startForm(blankDraft()),
    repeat: e => {
      const v = db.vendors.find(x => x.id === e.vendorId);
      addLog(`Repeat ${v ? v.name : 'entry'} ${fmtMoney(e.amountMinor, e.currency)} with today's date`);
      startForm(blankDraft({ kind: e.kind, amount: sanitize(String(Math.abs(e.amountMinor) / 100)), refund: e.amountMinor < 0,
        currency: e.currency, currencyTouched: true, vendorText: v ? v.name : '', vendorId: e.vendorId,
        categoryId: e.categoryId, categoryTouched: true, note: e.note, cStep: 2, repeatOf: e.id }));
    },
    save: another => {
      const d = draft, minor = parseMinor(d.amount);
      if (!minor) { setDraft({ ...d, error: 'Enter an amount.' }); return; }
      if (!d.categoryId) { setDraft({ ...d, error: 'Pick a category.' }); return; }
      if (db.entries.some(e => e.idemKey === d.idemKey)) { addLog('Second submit ignored: same Idempotency-Key'); return; }
      let vendors = db.vendors, vendorId = d.vendorId;
      const t = d.vendorText.trim();
      if (!vendorId && t) {
        const ex = vendors.find(v => norm(v.name) === norm(t));
        if (ex) { vendorId = ex.id; vendors = vendors.map(v => v.id === ex.id ? { ...v, archived: false } : v); }
        else { vendorId = 'v' + uid(); vendors = [...vendors, { id: vendorId, name: t, archived: false }]; addLog(`Created vendor «${t}»`); }
      }
      const entry = { id: 'e' + uid(), kind: d.kind, amountMinor: (d.refund && d.kind === 'expense' ? -1 : 1) * minor, currency: d.currency,
        vendorId: vendorId || null, categoryId: d.categoryId, date: d.date, note: d.note.trim(), createdAt: Date.now(), idemKey: d.idemKey, deleted: false };
      setDb({ vendors, entries: [...db.entries, entry] });
      const secs = (Date.now() - openedAt) / 1000;
      setTimes(x => [...x, secs]);
      addLog(`Saved ${fmtMoney(entry.amountMinor, entry.currency)} · ${catName(entry.categoryId)} in ${secs.toFixed(1)} s`);
      setToast({ text: `Saved ${fmtMoney(entry.amountMinor, entry.currency)}`, secs, id: entry.id });
      if (another) startForm(blankDraft({ kind: d.kind, date: d.date, currency: d.currency }));
      else setScreen('list');
    },
    undo: id => { setDb(x => ({ ...x, entries: x.entries.map(e => e.id === id ? { ...e, deleted: true } : e) })); setToast(null); addLog('Undo: entry deleted (soft)'); },
  };

  const v = VARIANTS.find(x => x.key === variant);
  const i = VARIANTS.indexOf(v);
  const go = k => { location.hash = k; };
  return html`
    <div class="top">
      <span class="proto-tag">Prototype · throwaway · fake data</span>
      <nav class="switcher" aria-label="Variant">
        <button class="arrow" onClick=${() => go(VARIANTS[(i + VARIANTS.length - 1) % VARIANTS.length].key)} aria-label="Previous variant">←</button>
        ${VARIANTS.map(x => html`<button class=${x.key === variant ? 'on' : ''} onClick=${() => go(x.key)}>${x.label} ${x.name}</button>`)}
        <button class="arrow" onClick=${() => go(VARIANTS[(i + 1) % VARIANTS.length].key)} aria-label="Next variant">→</button>
      </nav>
    </div>
    <main class="page">
      <section class="phone" aria-label="Phone screen">
        ${screen === 'list' ? html`<${ListScreen} db=${db} m=${m} />` : html`<${v.Comp} key=${variant + draft.idemKey} db=${db} draft=${draft} m=${m} />`}
        ${toast && html`<div class="toast" role="status"><span>${toast.text} <small>${toast.secs.toFixed(1)} s</small></span><button onClick=${() => m.undo(toast.id)}>Undo</button></div>`}
      </section>
      <${Panel} variant=${variant} draft=${draft} db=${db} openedAt=${openedAt} screen=${screen} times=${times} log=${log} />
    </main>`;
}
render(html`<${App} />`, document.getElementById('app'));
</script>
