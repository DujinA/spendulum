apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spendulum
  annotations:
    # Platform Applications take lower waves so they are healthy before the app syncs.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/DujinA/spendulum.git
    targetRevision: master
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: spendulum
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
