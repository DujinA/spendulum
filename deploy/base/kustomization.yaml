apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: spendulum
    includeSelectors: true

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: spendulum
    literals:
      - SPENDULUM_HTTP_ADDR=:8080
      - SPENDULUM_LOG_LEVEL=info
