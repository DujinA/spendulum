version: "3"

vars:
  GO_TOOL: go tool -modfile=tools/go.mod
  GO_TOOL_FROM_DEPLOY: go tool -modfile=../backend/tools/go.mod
  IMAGE: spendulum:dev

env:
  SPENDULUM_DATABASE_URL:
    sh: echo "${SPENDULUM_DATABASE_URL:-postgres://spendulum:spendulum@localhost:${SPENDULUM_DB_PORT:-5432}/spendulum?sslmode=disable}"

tasks:
  default:
    cmds:
      - task --list

  install:
    desc: Install the web and e2e dependencies
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - pnpm-lock.yaml
      - "*/package.json"

  gen:
    desc: Regenerate Go server stubs, sqlc code and TypeScript API types
    deps: [install]
    cmds:
      - task: gen:go
      - pnpm --filter @spendulum/web gen

  gen:go:
    internal: true
    dir: backend
    cmds:
      - "{{.GO_TOOL}} oapi-codegen -config oapi-codegen.yaml ../api/openapi.yaml"
      - "{{.GO_TOOL}} sqlc generate"

  lint:
    desc: Redocly, golangci-lint, govulncheck, eslint, tsc and the deploy manifests
    cmds:
      - task: lint:api
      - task: lint:go
      - task: vulncheck
      - task: lint:web
      - task: manifests

  lint:api:
    desc: Redocly lint of the API contract
    deps: [install]
    cmds:
      - pnpm exec redocly lint api/openapi.yaml

  lint:go:
    desc: golangci-lint on the backend
    dir: backend
    cmds:
      - "{{.GO_TOOL}} golangci-lint run ./..."

  vulncheck:
    desc: govulncheck on the backend; fails on a vulnerability the code reaches
    dir: backend
    cmds:
      - "{{.GO_TOOL}} govulncheck ./..."

  lint:web:
    desc: eslint and tsc on the web app, tsc on the e2e tests
    deps: [install]
    cmds:
      - pnpm --filter @spendulum/web lint
      - pnpm --filter @spendulum/web typecheck
      - pnpm --filter @spendulum/e2e typecheck

  manifests:
    desc: Build every overlay and deploy/argocd, validate them with kubeconform -strict, and run the manifest tests
    dir: deploy
    set: [errexit, pipefail]
    vars:
      KUBERNETES_VERSION: 1.36.0
      # CRD schemas (Argo CD, CloudNativePG, Sealed Secrets, ...) pinned to one commit of the catalog.
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/89c736bdde38b5fecd0f8436ec5f3aa3679a3b86/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json
    cmds:
      - |
        for dir in overlays/*/ argocd/; do
          echo "kubeconform $dir"
          go tool kustomize build "$dir" |
            go tool kubeconform -strict -summary \
              -kubernetes-version {{.KUBERNETES_VERSION}} \
              -schema-location default \
              -schema-location '{{.CRD_SCHEMAS}}'
        done
      - "{{.GO_TOOL_FROM_DEPLOY}} golangci-lint run --config ../backend/.golangci.yml ./..."
      - go test ./...

  test:
    desc: Go tests with the race detector (Docker runs PostgreSQL) and Vitest
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    desc: Go tests with the race detector; Docker runs PostgreSQL
    dir: backend
    cmds:
      - go test -race ./...

  test:web:
    desc: Vitest
    deps: [install]
    cmds:
      - pnpm --filter @spendulum/web test

  build:web:
    desc: Type-check and build the web app with Vite
    deps: [install]
    cmds:
      - pnpm --filter @spendulum/web build

  migrations:
    desc: Goose up on an empty database, and the ADR 0008 checks against master (MIGRATIONS_BASE_REF)
    dir: backend
    cmds:
      - go test -race -count=1 ./migrations/...

  check:
    desc: The CI checks except the image build, Trivy and e2e. Stage your changes first; the diff check compares the tree with the index.
    cmds:
      - task: gen
      - git diff --exit-code
      - task: lint
      - task: test

  db:
    desc: Start the development database
    cmds:
      - docker compose up --detach --wait db

  migrate:
    desc: Apply pending migrations to the development database
    deps: [db]
    dir: backend
    cmds:
      - go run ./cmd/spendulum migrate

  dev:
    desc: Database, migrations, Go server on :8080 and the Vite dev server with /api proxied
    deps: [install]
    cmds:
      - task: migrate
      - task: dev:servers

  dev:servers:
    internal: true
    deps: [dev:api, dev:web]

  dev:api:
    internal: true
    dir: backend
    cmds:
      - go run ./cmd/spendulum serve

  dev:web:
    internal: true
    cmds:
      - pnpm --filter @spendulum/web dev

  build:
    desc: Build the image
    cmds:
      - docker build --tag {{.IMAGE}} .

  e2e:
    desc: Build the image (or use E2E_IMAGE) and run the Playwright smoke tests against it on compose
    deps: [install]
    vars:
      COMPOSE: docker compose --file e2e/compose.e2e.yaml
    env:
      SPENDULUM_IMAGE: '{{.E2E_IMAGE | default "spendulum:e2e"}}'
      E2E_UID:
        sh: id -u
      E2E_GID:
        sh: id -g
    cmds:
      - '[ -n "{{.E2E_IMAGE}}" ] || docker build --tag spendulum:e2e .'
      - defer: "{{.COMPOSE}} --profile test down --volumes --remove-orphans"
      - "{{.COMPOSE}} --profile test run --rm playwright"
