name: Set up toolchains
description: Go from backend/go.mod, Node from web/.nvmrc, pnpm from corepack, and Task, each with its cache.

inputs:
  go:
    description: Set up Go with its module and build cache.
    default: "false"
  node:
    description: Set up Node and pnpm with the pnpm store cache.
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: |
          backend/go.sum
          backend/tools/go.sum
          deploy/go.sum

    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: web/.nvmrc
        # pnpm does not exist yet; the store is cached below, once corepack has installed it.
        package-manager-cache: false

    # Node 25 and later ship without corepack.
    - if: inputs.node == 'true'
      id: pnpm
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: |
        npm install --global corepack@0.36.0
        corepack enable
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - if: inputs.node == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        version: 3.54.0
        repo-token: ${{ github.token }}
