openapi: 3.1.0
info:
  title: Spendulum API
  version: 0.1.0
  description: |
    The HTTP API of Spendulum. Every operation under `/api` answers errors as
    RFC 9457 `application/problem+json`. `/healthz` and `/readyz` are probes for
    the platform and sit outside `/api`.

    Every `/api` operation except logging in needs the session cookie and
    answers 401 without a valid one. A mutating `/api` request must have
    `Content-Type: application/json` (otherwise 415), and a cross-origin one
    is refused with 403.
servers:
  - url: /
security:
  - session: []
paths:
  /api/session:
    post:
      operationId: createSession
      security: []
      summary: Log in
      description: |
        Checks the email and password and starts a session that lasts 30 days.
        A wrong password and an unknown email answer the same 401. After 5 failed
        logins for the same email and IP within 15 minutes, further attempts
        answer 429 until the oldest failure is 15 minutes old.
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Too many failed logins for this email from this IP.
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getSession
      summary: The current session
      description: Answers 200 while the session cookie is valid. A session older than 15 days is renewed for 30 days.
      tags: [session]
      responses:
        "200":
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSession
      summary: Log out
      description: Deletes the current session on the server and clears the cookie.
      tags: [session]
      responses:
        "204":
          description: Logged out; the session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/settings:
    get:
      operationId: getSettings
      summary: The user's settings
      tags: [settings]
      responses:
        "200":
          description: The user's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/categories:
    get:
      operationId: listCategories
      summary: The categories a picker offers
      description: The user's categories that are not archived, expense categories first, each kind in manual order.
      tags: [categories]
      responses:
        "200":
          description: The categories that are not archived.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/vendors:
    get:
      operationId: listVendors
      summary: The vendors the Vendor sheet offers
      description: |
        The user's vendors for an entry of the given kind, each with its number
        of entries of that kind and the category and currency of the latest one.
        Names are compared by their key: lowercase, without diacritics, letters
        and digits only.

        Without `name`, `vendors` holds every vendor that is not archived, most
        used first. With `name`:
        - `match` is the vendor with the same key, archived or not;
        - `vendors` are the other vendors that are not archived and whose key
          contains the name's key, most used first;
        - `nearMatches`, only when there is no match and the key has at least 4
          characters, are up to 3 other vendors, archived or not, whose key is
          within Damerau-Levenshtein distance 2 (an adjacent swap counts as 1),
          closest first.
      tags: [vendors]
      parameters:
        - name: kind
          in: query
          required: true
          description: The kind of the entry being recorded; use counts and the latest entry are of this kind.
          schema:
            $ref: "#/components/schemas/Kind"
        - name: name
          in: query
          description: The name typed in the Vendor sheet.
          schema:
            type: string
      responses:
        "200":
          description: The vendors that match the name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorMatches"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/entries:
    get:
      operationId: listEntries
      summary: List entries
      description: |
        All of the user's entries, newest entry date first; entries on the same
        date are newest created first. Pass `nextCursor` from a page as `cursor`
        to get the page after it.
      tags: [entries]
      parameters:
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: The most entries a page holds.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createEntry
      summary: Record an expense or an income
      description: |
        Records the entry in the user's primary currency. An income amount must
        be more than 0 and an expense amount must not be 0; a negative expense
        is a refund. The note is stored trimmed.

        A `vendorName` with the same key as one of the user's vendors names that
        vendor and unarchives it; any other name creates a vendor together with
        the entry. A refused entry creates no vendor.

        A retry with the same `Idempotency-Key` and body answers the entry the
        first request created, and creates no other. The same key with a
        different body answers 422. Keys are kept for 24 hours.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEntry"
      responses:
        "201":
          description: The entry was recorded, now or by an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/entries/{id}:
    get:
      operationId: getEntry
      summary: One entry
      tags: [entries]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /healthz:
    get:
      operationId: getHealthz
      security: []
      summary: Liveness probe
      description: Answers 200 while the process serves requests, whether or not the database answers.
      tags: [probes]
      responses:
        "200":
          description: The process is serving requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatus"
  /readyz:
    get:
      operationId: getReadyz
      security: []
      summary: Readiness probe
      description: Answers 200 when a database ping succeeds and 503 when it does not.
      tags: [probes]
      responses:
        "200":
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatus"
        "503":
          description: The database does not answer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: spendulum_session
      description: The server-side session started by logging in.
  headers:
    SessionCookie:
      description: The `spendulum_session` cookie, `HttpOnly`, `Secure`, `SameSite=Lax`, with an explicit `Max-Age`.
      required: true
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A key the client makes when the form opens and sends again on every retry.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session, or the email or password is incorrect.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: "A mutating request without `Content-Type: application/json`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource, or it belongs to another user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The request is well formed but breaks a rule; the detail says which.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Settings:
      type: object
      required: [primaryCurrency, timeZone]
      properties:
        primaryCurrency:
          type: string
          description: The ISO 4217 code new entries are recorded in.
        timeZone:
          type: string
          description: The IANA time zone that decides "today".
    Kind:
      type: string
      enum: [expense, income]
    Category:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/Kind"
        name:
          type: string
    NewEntry:
      type: object
      required: [kind, amount, categoryId, entryDate]
      properties:
        kind:
          $ref: "#/components/schemas/Kind"
        amount:
          type: integer
          format: int64
          description: In minor units of the primary currency; negative only for a refund.
        currency:
          type: string
          description: ISO 4217 code. It must be the primary currency, which is also the default.
        categoryId:
          type: string
          format: uuid
          description: A category of the same kind.
        vendorName:
          type: string
          description: Who the expense was paid to or the income came from. Absent or blank means no vendor.
        entryDate:
          type: string
          format: date
        note:
          type: string
    Entry:
      type: object
      required: [id, kind, amount, currency, categoryId, categoryName, entryDate, note, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/Kind"
        amount:
          type: integer
          format: int64
          description: In minor units of `currency`, as typed; negative for a refund.
        currency:
          type: string
          description: ISO 4217 code.
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        vendorId:
          type: string
          format: uuid
          description: Absent when the entry has no vendor.
        vendorName:
          type: string
          description: Absent when the entry has no vendor.
        entryDate:
          type: string
          format: date
        note:
          type: string
          description: Empty when the entry has no note.
        createdAt:
          type: string
          format: date-time
    EntryPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        nextCursor:
          type: string
          description: Absent on the last page.
    Vendor:
      type: object
      required: [id, name, archived, useCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        useCount:
          type: integer
          description: The number of the user's entries of the requested kind with this vendor.
        latest:
          $ref: "#/components/schemas/LatestUse"
    LatestUse:
      type: object
      description: |
        The category and currency of the vendor's latest entry of the requested
        kind, latest by entry date, then creation time. Absent when it has none.
      required: [categoryId, categoryName, currency]
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        currency:
          type: string
          description: ISO 4217 code.
    VendorMatches:
      type: object
      required: [vendors, nearMatches]
      properties:
        match:
          $ref: "#/components/schemas/Vendor"
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"
        nearMatches:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    Session:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The email of the logged-in user.
    ProbeStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      description: An RFC 9457 problem details object.
      required: [title, status]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation of this occurrence.
        instance:
          type: string
          description: A URI reference that identifies this occurrence.
