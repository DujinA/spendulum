openapi: 3.1.0
info:
  title: Spendulum API
  version: 0.1.0
  description: |
    The HTTP API of Spendulum. Every operation under `/api` answers errors as
    RFC 9457 `application/problem+json`. `/healthz` and `/readyz` are probes for
    the platform and sit outside `/api`.

    Every `/api` operation except logging in needs the session cookie and
    answers 401 without a valid one. A mutating `/api` request must have
    `Content-Type: application/json` (otherwise 415), and a cross-origin one
    is refused with 403.
servers:
  - url: /
security:
  - session: []
paths:
  /api/session:
    post:
      operationId: createSession
      security: []
      summary: Log in
      description: |
        Checks the email and password and starts a session that lasts 30 days.
        A wrong password and an unknown email answer the same 401. After 5 failed
        logins for the same email and IP within 15 minutes, further attempts
        answer 429 until the oldest failure is 15 minutes old.
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Too many failed logins for this email from this IP.
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getSession
      summary: The current session
      description: Answers 200 while the session cookie is valid. A session older than 15 days is renewed for 30 days.
      tags: [session]
      responses:
        "200":
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSession
      summary: Log out
      description: Deletes the current session on the server and clears the cookie.
      tags: [session]
      responses:
        "204":
          description: Logged out; the session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /healthz:
    get:
      operationId: getHealthz
      security: []
      summary: Liveness probe
      description: Answers 200 while the process serves requests, whether or not the database answers.
      tags: [probes]
      responses:
        "200":
          description: The process is serving requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatus"
  /readyz:
    get:
      operationId: getReadyz
      security: []
      summary: Readiness probe
      description: Answers 200 when a database ping succeeds and 503 when it does not.
      tags: [probes]
      responses:
        "200":
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatus"
        "503":
          description: The database does not answer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: spendulum_session
      description: The server-side session started by logging in.
  headers:
    SessionCookie:
      description: The `spendulum_session` cookie, `HttpOnly`, `Secure`, `SameSite=Lax`, with an explicit `Max-Age`.
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session, or the email or password is incorrect.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: "A mutating request without `Content-Type: application/json`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    Session:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The email of the logged-in user.
    ProbeStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      description: An RFC 9457 problem details object.
      required: [title, status]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation of this occurrence.
        instance:
          type: string
          description: A URI reference that identifies this occurrence.
